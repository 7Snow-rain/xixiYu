{% extends "base.html" %}
{% block title %}XML导入{% endblock %}
{% block content %}
<div class="card">
    <div class="card-header">
        <h4>📄 XML 数据导入</h4>
    </div>
    <div class="card-body">
        <form method="POST" action="{{ url_for('xml_import') }}" id="xmlForm">
            <div class="mb-3">
                <label for="xml_data" class="form-label">输入 XML 数据</label>
                <textarea class="form-control font-monospace" id="xml_data" name="xml_data" rows="12" placeholder="&lt;?xml version=&quot;1.0&quot; encoding=&quot;UTF-8&quot;?&gt;
&lt;!DOCTYPE foo [
  &lt;!ENTITY xxe SYSTEM &quot;file:///etc/passwd&quot;&gt;
]&gt;
&lt;users&gt;
  &lt;user&gt;
    &lt;name&gt;&amp;xxe;&lt;/name&gt;
    &lt;email&gt;test@example.com&lt;/email&gt;
  &lt;/user&gt;
&lt;/users&gt;" style="font-size: 0.85rem;"></textarea>
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-primary">📥 导入</button>
            </div>
        </form>
        <hr>
        <h5>📋 解析结果</h5>
        <pre id="resultArea" class="console-output">等待导入...</pre>
    </div>
</div>
{% endblock %}
{% block extra_scripts %}
<script>
document.getElementById('xmlForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var formData = new FormData(this);
    fetch('{{ url_for("xml_import") }}', {
        method: 'POST',
        body: new URLSearchParams(formData)
    })
    .then(function(response) { return response.json(); })
    .then(function(data) {
        document.getElementById('resultArea').textContent = JSON.stringify(data, null, 2);
    })
    .catch(function(err) {
        document.getElementById('resultArea').textContent = '请求失败: ' + err;
    });
});
</script>
{% endblock %}
